<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia Clínica - Podología</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>
  <header>
    <h2>Historia Clínica - Podología</h2>
  </header>

  <main class="odontologia-container">
    <form id="formPodologia">
      <div class="odontologia-section">
        <h2>📋 Datos Generales del Paciente</h2>
        <div class="grid-2">
          <div>
            <label class="odontologia-label">Nombre completo del paciente *</label>
            <input type="text" class="odontologia-input" id="nombre" required>
          </div>
          <div>
            <label class="odontologia-label">Dirección</label>
            <input type="text" class="odontologia-input" id="direccion">
          </div>
          <div>
            <label class="odontologia-label">Correo electrónico</label>
            <input type="email" class="odontologia-input" id="email">
          </div>
          <div>
            <label class="odontologia-label">Ocupación</label>
            <input type="text" class="odontologia-input" id="ocupacion">
          </div>
          <div>
            <label class="odontologia-label">Teléfono</label>
            <input type="text" class="odontologia-input" id="telefono">
          </div>
          <div>
            <label class="odontologia-label">Fecha de consulta *</label>
            <input type="date" class="odontologia-input" id="fecha" required>
          </div>
          <div>
            <label class="odontologia-label">Edad *</label>
            <input type="number" class="odontologia-input" id="edad" required min="0" max="120">
          </div>
          <div>
            <label class="odontologia-label">Estado civil</label>
            <select class="odontologia-select" id="estadoCivil">
              <option value="">Seleccionar</option>
              <option value="Soltero/a">Soltero/a</option>
              <option value="Casado/a">Casado/a</option>
              <option value="Divorciado/a">Divorciado/a</option>
              <option value="Viudo/a">Viudo/a</option>
              <option value="Unión libre">Unión libre</option>
            </select>
          </div>
        </div>
        
        <div style="margin-top: 1rem;">
          <label class="odontologia-label">¿Cuál es el objetivo de su visita? *</label>
          <textarea class="odontologia-textarea" id="objetivoVisita" required></textarea>
        </div>
        
        <div style="margin-top: 1rem;">
          <label class="odontologia-label">Reacciones alérgicas</label>
          <textarea class="odontologia-textarea" id="alergias"></textarea>
        </div>
      </div>

      <div class="odontologia-section">
        <h2>🏥 Antecedentes Médicos</h2>
        <div class="grid-3">
          <div class="checkbox-group">
            <label>Embarazo:</label>
            <label><input type="radio" name="embarazo" value="Sí"> Sí</label>
            <label><input type="radio" name="embarazo" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Hipertensión:</label>
            <label><input type="radio" name="hipertension" value="Sí"> Sí</label>
            <label><input type="radio" name="hipertension" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Insuficiencia cardíaca desequilibrada:</label>
            <label><input type="radio" name="insuficienciaCardiaca" value="Sí"> Sí</label>
            <label><input type="radio" name="insuficienciaCardiaca" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Marcapasos u otros dispositivos eléctricos:</label>
            <label><input type="radio" name="marcapasos" value="Sí"> Sí</label>
            <label><input type="radio" name="marcapasos" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Diabetes:</label>
            <label><input type="radio" name="diabetes" value="Sí"> Sí</label>
            <label><input type="radio" name="diabetes" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Cáncer o tumores:</label>
            <label><input type="radio" name="cancer" value="Sí"> Sí</label>
            <label><input type="radio" name="cancer" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Dermatitis:</label>
            <label><input type="radio" name="dermatitis" value="Sí"> Sí</label>
            <label><input type="radio" name="dermatitis" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Epilepsia:</label>
            <label><input type="radio" name="epilepsia" value="Sí"> Sí</label>
            <label><input type="radio" name="epilepsia" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Micosis:</label>
            <label><input type="radio" name="micosis" value="Sí"> Sí</label>
            <label><input type="radio" name="micosis" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Isquemias:</label>
            <label><input type="radio" name="isquemias" value="Sí"> Sí</label>
            <label><input type="radio" name="isquemias" value="No" checked> No</label>
          </div>
          <div class="checkbox-group">
            <label>Trombosis, tromboflebitis o hemorragias activas:</label>
            <label><input type="radio" name="trombosis" value="Sí"> Sí</label>
            <label><input type="radio" name="trombosis" value="No" checked> No</label>
          </div>
        </div>
      </div>

      <div class="odontologia-section">
        <h2>👩 Solo Mujeres</h2>
        <div class="grid-2">
          <div class="checkbox-group">
            <label>Uso de tacón:</label>
            <label><input type="radio" name="usoTacon" value="Sí"> Sí</label>
            <label><input type="radio" name="usoTacon" value="No" checked> No</label>
          </div>
          <div>
            <label class="odontologia-label">Altura de tacón (cm)</label>
            <input type="number" class="odontologia-input" id="alturaTacon" min="0">
          </div>
          <div>
            <label class="odontologia-label">Horas de uso diario</label>
            <input type="number" class="odontologia-input" id="horasUsoTacon" min="0" max="24">
          </div>
          <div>
            <label class="odontologia-label">Días de la semana que usa tacón</label>
            <input type="number" class="odontologia-input" id="diasTacon" min="0" max="7">
          </div>
        </div>
      </div>

      <div class="odontologia-section">
        <h2>📊 Exploración Física</h2>
        <div class="grid-3">
          <div>
            <label class="odontologia-label">Peso (kg)</label>
            <input type="number" class="odontologia-input" id="peso" min="0" step="0.1">
          </div>
          <div>
            <label class="odontologia-label">Estatura (cm)</label>
            <input type="number" class="odontologia-input" id="estatura" min="0" step="0.1">
          </div>
          <div>
            <label class="odontologia-label">I.M.C.</label>
            <input type="text" class="odontologia-input" id="imc" readonly>
          </div>
          <div>
            <label class="odontologia-label">F.C. (Frecuencia cardíaca)</label>
            <input type="number" class="odontologia-input" id="frecuenciaCardiaca" min="0">
          </div>
          <div>
            <label class="odontologia-label">Pulso</label>
            <input type="text" class="odontologia-input" id="pulso">
          </div>
          <div>
            <label class="odontologia-label">Temperatura (°C)</label>
            <input type="number" class="odontologia-input" id="temperatura" min="0" step="0.1">
          </div>
        </div>
      </div>

      <div class="odontologia-section">
        <h2>🍽️ Hábitos y Alimentación</h2>
        <div class="grid-2">
          <div>
            <label class="odontologia-label">Consumo de alcohol</label>
            <input type="text" class="odontologia-input" id="alcohol">
          </div>
          <div>
            <label class="odontologia-label">Consumo de cigarro</label>
            <input type="text" class="odontologia-input" id="cigarro">
          </div>
          <div>
            <label class="odontologia-label">¿Se desvela frecuentemente?</label>
            <input type="text" class="odontologia-input" id="desvela">
          </div>
          <div>
            <label class="odontologia-label">¿Cuánta agua toma al día? (litros)</label>
            <input type="number" class="odontologia-input" id="agua" min="0" step="0.1">
          </div>
          <div>
            <label class="odontologia-label">¿Toma medicamentos, suplementos o vitaminas?</label>
            <input type="text" class="odontologia-input" id="medicamentos">
          </div>
          <div>
            <label class="odontologia-label">Calzado diario</label>
            <input type="text" class="odontologia-input" id="calzado">
          </div>
        </div>
        
        <h3 style="margin-top: 1.5rem;">Tipo de Alimentación</h3>
        <div class="grid-3">
          <div>
            <label class="odontologia-label">Consumo de carne</label>
            <input type="text" class="odontologia-input" id="carne">
          </div>
          <div>
            <label class="odontologia-label">Consumo de pescado</label>
            <input type="text" class="odontologia-input" id="pescado">
          </div>
          <div>
            <label class="odontologia-label">Consumo de verduras</label>
            <input type="text" class="odontologia-input" id="verduras">
          </div>
          <div>
            <label class="odontologia-label">Consumo de frutas</label>
            <input type="text" class="odontologia-input" id="frutas">
          </div>
          <div>
            <label class="odontologia-label">Consumo de pan</label>
            <input type="text" class="odontologia-input" id="pan">
          </div>
          <div>
            <label class="odontologia-label">¿Realiza ejercicio?</label>
            <input type="text" class="odontologia-input" id="ejercicio">
          </div>
          <div>
            <label class="odontologia-label">¿Qué tipo de ejercicio?</label>
            <input type="text" class="odontologia-input" id="tipoEjercicio">
          </div>
          <div>
            <label class="odontologia-label">¿Cuántas veces a la semana?</label>
            <input type="number" class="odontologia-input" id="frecuenciaEjercicio" min="0" max="7">
          </div>
        </div>
        
        <div style="margin-top: 1rem;">
          <label class="odontologia-label">¿Ha tenido cirugías estéticas o funcionales?</label>
          <textarea class="odontologia-textarea" id="cirugias"></textarea>
        </div>
        
        <div style="margin-top: 1rem;">
          <label class="odontologia-label">¿Acostumbra a tomar té o café muy caliente o muy frío?</label>
          <input type="text" class="odontologia-input" id="bebidas">
        </div>
        
        <div style="margin-top: 1rem;">
          <label class="odontologia-label">Frecuencia de consumo de bebidas calientes/frías</label>
          <input type="text" class="odontologia-input" id="frecuenciaBebidas">
        </div>
        
        <div style="margin-top: 1rem;">
          <label class="odontologia-label">¿Cuáles son sus hábitos de limpieza?</label>
          <textarea class="odontologia-textarea" id="habitosLimpieza"></textarea>
        </div>
        
        <div style="margin-top: 1rem;">
          <label class="odontologia-label">¿Utiliza algún producto específico?</label>
          <input type="text" class="odontologia-input" id="productosEspecificos">
        </div>
      </div>

      <div class="odontologia-section">
        <h2>💰 Costos del Tratamiento</h2>
        <div id="costos-container">
          <div class="costo-item">
            <div class="grid-3">
              <div>
                <label class="odontologia-label">Fecha</label>
                <input type="date" class="odontologia-input costo-fecha">
              </div>
              <div>
                <label class="odontologia-label">Concepto</label>
                <input type="text" class="odontologia-input costo-concepto">
              </div>
              <div>
                <label class="odontologia-label">Costo ($)</label>
                <input type="number" class="odontologia-input costo-monto" min="0" step="0.01">
              </div>
            </div>
          </div>
        </div>
        <button type="button" id="agregar-costo" style="margin-top: 1rem; background: #6c757d;">+ Agregar otro costo</button>
      </div>

      <div class="odontologia-section">
        <h2>📝 Observaciones y Tratamiento</h2>
        <div>
          <label class="odontologia-label">Observaciones y plan de tratamiento</label>
          <textarea class="odontologia-textarea" id="observaciones" rows="4"></textarea>
        </div>
      </div>

      <div class="form-buttons">
        <button type="submit" id="btnGuardar">💾 Guardar Ficha</button>
        <button type="button" onclick="window.location.href='admin.html'" class="danger">❌ Cancelar</button>
      </div>
    </form>
  </main>

  <script src="podologia.js"></script>
</body>
</html>
