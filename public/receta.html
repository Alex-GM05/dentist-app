<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Receta y Tratamiento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>
  <header class="no-print">
    <h1>Tratamiento y Receta Médica</h1>
  </header>

  <main>
    <form id="formReceta">
      <div class="form-group">
        <label for="correoPaciente">Correo del paciente:</label>
        <input type="email" id="correoPaciente" name="correoPaciente" required />
      </div>

      <!-- Tabla OD / DX / TX -->
      <h3>Diagnóstico y Tratamiento por Diente</h3>
      <div class="tabla-dientes">
        <table>
          <thead>
            <tr><th>OD</th><th>DX.</th><th>TX.</th><th>OD</th><th>DX.</th><th>TX.</th></tr>
          </thead>
          <tbody id="tablaDientesBody"></tbody>
        </table>
      </div>

      <!-- Tabla de costos -->
      <h3>Costos</h3>
      <div class="tabla-costos">
        <table>
          <thead>
            <tr><th>Concepto</th><th>Costo x Unidad</th><th>Costo Total</th><th># Citas</th></tr>
          </thead>
          <tbody id="tablaCostosBody">
            ${[...Array(5)].map((_, i) => `
              <tr>
                <td><input type="text" name="concepto${i}" /></td>
                <td><input type="number" name="unidad${i}" /></td>
                <td><input type="number" name="total${i}" /></td>
                <td><input type="number" name="citas${i}" /></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <!-- Receta -->
      <div class="form-group">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required />
      </div>

      <div class="form-group">
        <label for="medicamentos">Medicamentos o indicaciones:</label>
        <textarea id="medicamentos" name="medicamentos" rows="5" required></textarea>
      </div>

      <div class="form-buttons no-print">
        <button type="submit">Guardar Receta</button>
        <button type="button" onclick="window.print()">Imprimir</button>
        <button type="button" onclick="window.location.href='preview-odontologia.html'" class="danger">Volver</button>
      </div>
    </form>

    <div id="previewReceta" style="margin-top: 2rem;"></div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().signInAnonymously()
      .then(() => console.log("Autenticado para receta"))
      .catch(error => console.error("Error autenticando:", error));

    // Generar filas de OD/DX/TX
    const tablaDientes = document.getElementById("tablaDientesBody");
    const dientes = [
      [18,17,16,15,14,13,12,11],
      [21,22,23,24,25,26,27,28],
      [48,47,46,45,44,43,42,41],
      [31,32,33,34,35,36,37,38]
    ];
    dientes.forEach(fila => {
      const tr = document.createElement("tr");
      fila.forEach(od => {
        tr.innerHTML += `
          <td><input type="text" name="od${od}" value="${od}" readonly /></td>
          <td><input type="text" name="dx${od}" /></td>
          <td><input type="text" name="tx${od}" /></td>
        `;
      });
      tablaDientes.appendChild(tr);
    });

    document.getElementById("formReceta").addEventListener("submit", async (e) => {
      e.preventDefault();

      const correo = document.getElementById("correoPaciente").value;
      const fecha = document.getElementById("fecha").value;
      const medicamentos = document.getElementById("medicamentos").value;

      // Obtener los datos de diagnóstico/tratamiento
      const diagnosticos = {};
      dientes.flat().forEach(od => {
        diagnosticos[`dx${od}`] = document.querySelector(`[name="dx${od}"]`).value;
        diagnosticos[`tx${od}`] = document.querySelector(`[name="tx${od}"]`).value;
      });

      // Obtener costos
      const costos = [];
      for (let i = 0; i < 5; i++) {
        costos.push({
          concepto: document.querySelector(`[name="concepto${i}"]`).value,
          unidad: document.querySelector(`[name="unidad${i}"]`).value,
          total: document.querySelector(`[name="total${i}"]`).value,
          citas: document.querySelector(`[name="citas${i}"]`).value
        });
      }

      try {
        const receta = {
          correo, fecha, medicamentos, diagnosticos, costos, timestamp: new Date()
        };

        await db.collection("recetas").add(receta);

        document.getElementById("previewReceta").innerHTML = `
          <hr>
          <h2>Receta médica y tratamiento</h2>
          <p><strong>Correo:</strong> ${correo}</p>
          <p><strong>Fecha:</strong> ${fecha}</p>
          <h3>Indicaciones</h3>
          <p>${medicamentos.replace(/\n/g, "<br>")}</p>

          <h3>Diagnóstico y Tratamiento</h3>
          <p>Ver tabla superior.</p>

          <h3>Costos</h3>
          <ul>
            ${costos.map(c => `
              <li><strong>${c.concepto}</strong>: $${c.total} (${c.citas} citas)</li>
            `).join("")}
          </ul>

          <br><br>
          <div style="text-align: center;">
            ___________________________<br />
            Firma del doctor
          </div>
        `;

        alert("Receta y tratamiento guardados.");
      } catch (error) {
        console.error("Error al guardar receta:", error);
        alert("Error al guardar.");
      }
    });
  </script>
</body>
</html>
