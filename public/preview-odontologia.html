<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vista previa - Historia Clínica</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #printSection, #printSection * {
        visibility: visible;
      }
      #printSection {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vista previa del historial clínico</h1>
  </header>

  <main id="printSection">
    <div id="previewContent"></div>

    <div class="form-buttons no-print">
      <button onclick="window.print()">Imprimir</button>
      <button onclick="location.href='receta.html'">Receta</button>
      <button onclick="location.href='select-add.html'" class="danger">Volver</button>
    </div>
  </main>

  <script>
    const data = JSON.parse(localStorage.getItem("historiaOdontologia")) || {};
    const container = document.getElementById("previewContent");

    function crearElemento(label, valor) {
      if (!valor) return "";
      return `<p><strong>${label}:</strong> ${Array.isArray(valor) ? valor.join(", ") : valor}</p>`;
    }

    container.innerHTML = `
      ${crearElemento("Fecha", data.fecha)}
      ${crearElemento("Nombre", data.nombre)}
      ${crearElemento("Edad", data.edad)}
      ${crearElemento("Dirección", data.direccion)}
      ${crearElemento("Teléfono", data.telefono)}
      ${crearElemento("Email", data.email)}
      ${crearElemento("Ocupación", data.ocupacion)}
      ${crearElemento("Estado Civil", data.estadoCivil)}
      ${crearElemento("Recomendado por", data.recomendadoPor)}
      ${crearElemento("Salud", data.salud)}
      ${crearElemento("Peso", data.peso)}
      ${crearElemento("Estatura", data.estatura)}
      ${crearElemento("Enfermedad sistémica", data.sistemica)}
      ${crearElemento("¿Cuál?", data.sistemicaCual)}
      ${crearElemento("Enfermedad extra", data.enfermedadExtra)}
      ${crearElemento("Toma medicamento", data.medicamento)}
      ${crearElemento("¿Cuál?", data.medicamentoCual)}
      ${crearElemento("Alergias", data.alergias)}
      ${crearElemento("Problemas con anestesia", data.anestesia)}
      ${crearElemento("Última visita", data.ultimaVisita)}
      ${crearElemento("Fuma", data.fuma)}
      ${crearElemento("Cantidad/Frecuencia", data.fumaCantidad)}
      ${crearElemento("Drogas", data.drogas)}
      <h3>Mujeres</h3>
      ${crearElemento("Embarazo", data.embarazo)}
      ${crearElemento("Mes gestación", data.mesGestacion)}
      ${crearElemento("Anticonceptivo", data.anticonceptivo)}
      ${crearElemento("¿Cuál?", data.cualAnticonceptivo)}
      <h3>Menores de edad</h3>
      ${crearElemento("Padre/Madre", data.tutor)}
      ${crearElemento("Tel. Tutor", data.telefonoTutor)}
      ${crearElemento("Motivo consulta", data.motivoConsulta)}
    `;
  </script>
</body>
</html>
