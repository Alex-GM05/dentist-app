<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Previa - Historia Clínica Odontológica</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="preview-container">
    <div class="preview-header">
      <h1>Historia Clínica Odontológica</h1>
      <div class="no-print">
        <button onclick="window.print()" class="btn-primary">🖨️ Imprimir</button>
        <button onclick="window.history.back()" class="btn-secondary">← Volver</button>
      </div>
    </div>

    <div id="contenido">
      <!-- Los datos se cargarán aquí mediante JavaScript -->
    </div>

    <div class="no-print" style="margin-top: 2rem;">
      <button onclick="window.history.back()" class="btn-secondary">← Volver al formulario</button>
    </div>
  </div>

  <script src="preview-script.js"></script>
</body>
</html>
