<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vista previa Historia Clínica</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Vista Previa - Historia Clínica</h1>
    <div id="contenido"></div>

    <div class="btn-row no-print">
      <button onclick="window.print()">Imprimir</button>
      <button onclick="window.location.href='add-odontologia.html'">Regresar</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };
    firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore();

    const id=new URLSearchParams(window.location.search).get("id");
    async function cargar(){
      if(!id)return;
      const doc=await db.collection("historial-odontologia").doc(id).get();
      if(!doc.exists)return;
      const d=doc.data();
      document.getElementById("contenido").innerHTML=`
        <h2>Datos Generales</h2>
        <p><b>Nombre:</b> ${d.nombre||""}</p>
        <p><b>Edad:</b> ${d.edad||""}</p>
        <p><b>Sexo:</b> ${d.sexo||""}</p>
        <p><b>Email:</b> ${d.email||""}</p>
        <p><b>Teléfono:</b> ${d.telefono||""}</p>
        <p><b>Fecha:</b> ${d.fecha||""}</p>

        <h2>Antecedentes</h2>
        <p><b>Estado salud:</b> ${d.estadoSalud||""}</p>
        <p><b>Medicamentos:</b> ${d.medicamentos||""}</p>
        <p><b>Alergias:</b> ${d.alergias||""}</p>
        <p><b>Operaciones:</b> ${d.operaciones||""}</p>
        <p><b>Drogas:</b> ${d.drogas||""} ${d.tipoDrogas||""}</p>
        <p><b>Embarazo:</b> ${d.embarazo||""} ${d.mesesEmbarazo||""}</p>

        <h2>Motivo consulta</h2>
        <p>${d.motivoConsulta||""}</p>

        <h2>Costos</h2>
        <ul>${(d.costos||[]).map(c=>`<li>${c.fecha} - ${c.concepto} - $${c.costo}</li>`).join("")}</ul>
        <p><b>Total:</b> $${d.total||0}</p>

        <h2>Receta</h2>
        <p>${d.receta||""}</p>

        <hr>
        <h3>Aviso de privacidad</h3>
        <p>Sus datos serán utilizados únicamente con fines clínicos.</p>
      `;
    }
    cargar();
  </script>
</body>
</html>
