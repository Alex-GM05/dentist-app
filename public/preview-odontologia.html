<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vista Previa Historia Clínica</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>
</head>
<body>
  <div class="preview-container">
    <h1>Historia Clínica Odontológica</h1>
    <div id="contenido"></div>
    <button onclick="window.print()">Imprimir</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const correo = urlParams.get("correo");

    async function cargarDatos() {
      const snap = await db.collection("historial-odontologia").where("correo", "==", correo).orderBy("fecha", "desc").limit(1).get();
      if (!snap.empty) {
        const data = snap.docs[0].data();
        let html = `
          <p><b>Fecha:</b> ${data.fecha}</p>
          <p><b>Nombre:</b> ${data.nombre}</p>
          <p><b>Edad:</b> ${data.edad}</p>
          <p><b>Sexo:</b> ${data.sexo}</p>
          <p><b>Ocupación:</b> ${data.ocupacion || ""}</p>
          <h2>Costos</h2>
          <table>
            <tr><th>Concepto</th><th>Unidad</th><th>Costo Unidad</th><th>Total</th></tr>
            ${data.costos.map(c => `<tr><td>${c.concepto}</td><td>${c.unidad}</td><td>${c.costoUnidad}</td><td>${c.total}</td></tr>`).join("")}
          </table>
          <h3>Total General: $${data.totalGeneral}</h3>
          <h2>Receta</h2>
          <p>${data.receta || ""}</p>
          <h2>Odontograma</h2>
          <img src="odontograma.png" alt="Odontograma" class="odontograma">
        `;
        document.getElementById("contenido").innerHTML = html;
      } else {
        document.getElementById("contenido").innerHTML = "<p>No se encontró información.</p>";
      }
    }
    cargarDatos();
  </script>
</body>
</html>
