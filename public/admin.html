<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Administrador - Clínica Dental</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body>
  <header>
    <img src="BELADENT.jpg" alt="Logo Beladent" style="max-width: 150px;">
    <h1>Clínica BELADENT</h1>
    <h2>Panel del Administrador</h2>
  </header>

  <main class="admin-container">
    <div class="admin-section">
      <h3>Gestión de Pacientes</h3>
      
      <div class="search-panel">
        <div class="grid-2">
          <div>
            <label class="odontologia-label">Seleccionar especialidad:</label>
            <select id="especialidadSelect" class="odontologia-select" onchange="cargarPacientes()">
              <option value="">Seleccione especialidad</option>
              <option value="odontologia">Odontología</option>
              <option value="podologia">Podología</option>
            </select>
          </div>
          <div>
            <label class="odontologia-label">Buscar paciente:</label>
            <select id="pacienteSelect" class="odontologia-select" onchange="cargarHistorial()">
              <option value="">Seleccione un paciente</option>
            </select>
          </div>
        </div>

      <div id="historialClinico" class="historial-container">
        <h4>Historial Clínico</h4>
        <div id="detalleHistorial"></div>
      </div>
    </div>

    <div class="admin-buttons">
      <button type="button" onclick="window.location.href='select-add.html'" class="btn-primary">➕ Agregar Nuevo Paciente</button>
      <button onclick="logout()" class="btn-cancel">🚪 Cerrar Sesión</button>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
