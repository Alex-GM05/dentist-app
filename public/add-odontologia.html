<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historia Clínica Odontología</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
</head>
<body>
  <div class="container">
    <h1>Historia Clínica Odontológica</h1>
    <form id="odontologiaForm">

      <!-- DATOS GENERALES -->
      <section>
        <h2>Datos Generales</h2>
        <label>Nombre completo: <input type="text" name="nombre" required></label>
        <label>Edad: <input type="number" name="edad" required></label>
        <label>Sexo: 
          <select name="sexo" required>
            <option value="">Seleccione</option>
            <option>Hombre</option>
            <option>Mujer</option>
          </select>
        </label>
        <label>Correo electrónico: <input type="email" name="email" required></label>
        <label>Teléfono: <input type="text" name="telefono"></label>
        <label>Fecha: <input type="date" name="fecha" required></label>
      </section>

      <!-- ANTECEDENTES -->
      <section>
        <h2>Antecedentes</h2>
        <label>Padece alguna enfermedad: 
          <input type="text" name="enfermedad">
        </label>
        <label>Está bajo tratamiento médico: 
          <input type="text" name="tratamiento">
        </label>
        <label>Toma medicamentos: 
          <input type="text" name="medicamentos">
        </label>
        <label>Es alérgico a medicamentos o sustancias: 
          <input type="text" name="alergias">
        </label>
        <label>Ha sido operado: 
          <input type="text" name="operaciones">
        </label>
        <label>Ha recibido transfusiones: 
          <input type="text" name="transfusiones">
        </label>
        <label>Es diabético: 
          <select name="diabetico">
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </label>
        <label>Es hipertenso: 
          <select name="hipertenso">
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </label>
        <label>Está embarazada: 
          <select name="embarazo" id="embarazo">
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </label>
        <div id="embarazoExtra" style="display:none;">
          <label>Meses de embarazo: <input type="number" name="mesesEmbarazo"></label>
        </div>
        <label>Consume drogas: 
          <select name="drogas" id="drogas">
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </label>
        <div id="drogasExtra" style="display:none;">
          <label>¿Cuáles?: <input type="text" name="tipoDrogas"></label>
        </div>
      </section>

      <!-- ODONTOGRAMA -->
      <section>
        <h2>Odontograma</h2>
        <img src="odontograma.png" alt="Odontograma" style="max-width:100%; border:1px solid #ccc;">
      </section>

      <!-- COSTOS -->
      <section>
        <h2>Costos</h2>
        <table id="tablaCostos" border="1" style="width:100%; text-align:center;">
          <thead>
            <tr>
              <th>Concepto</th>
              <th>Unidades</th>
              <th>Costo por unidad</th>
              <th>Total</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button type="button" onclick="agregarFila()">➕ Agregar concepto</button>
        <h3>Total general: $<span id="granTotal">0</span></h3>
      </section>

      <!-- RECETA -->
      <section>
        <h2>Receta</h2>
        <textarea name="receta" rows="6" placeholder="Escriba la receta aquí..."></textarea>
      </section>

      <!-- FIRMAS -->
      <section class="firmas">
        <div>
          <p>__________________________</p>
          <p>Firma del paciente</p>
        </div>
        <div>
          <p>__________________________</p>
          <p>Firma del odontólogo</p>
        </div>
      </section>

      <button type="submit">Guardar y ver impresión</button>
    </form>
  </div>

  <script>
    // Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Condicionales
    document.getElementById("embarazo").addEventListener("change", function() {
      document.getElementById("embarazoExtra").style.display = this.value === "Sí" ? "block" : "none";
    });
    document.getElementById("drogas").addEventListener("change", function() {
      document.getElementById("drogasExtra").style.display = this.value === "Sí" ? "block" : "none";
    });

    // Costos dinámicos
    function agregarFila() {
      const tbody = document.querySelector("#tablaCostos tbody");
      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td><input type="text" name="concepto"></td>
        <td><input type="number" name="unidades" value="1" min="1" oninput="calcularTotalFila(this)"></td>
        <td><input type="number" name="costoUnidad" value="0" min="0" oninput="calcularTotalFila(this)"></td>
        <td class="totalFila">0</td>
        <td><button type="button" onclick="eliminarFila(this)">❌</button></td>
      `;
      tbody.appendChild(fila);
    }
    function calcularTotalFila(input) {
      const fila = input.closest("tr");
      const unidades = parseFloat(fila.querySelector("[name='unidades']").value) || 0;
      const costoUnidad = parseFloat(fila.querySelector("[name='costoUnidad']").value) || 0;
      const total = unidades * costoUnidad;
      fila.querySelector(".totalFila").textContent = total.toFixed(2);
      calcularGranTotal();
    }
    function eliminarFila(btn) {
      btn.closest("tr").remove();
      calcularGranTotal();
    }
    function calcularGranTotal() {
      let total = 0;
      document.querySelectorAll(".totalFila").forEach(td => total += parseFloat(td.textContent));
      document.getElementById("granTotal").textContent = total.toFixed(2);
    }

    // Guardar en Firestore
    document.getElementById("odontologiaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {};
      new FormData(form).forEach((v, k) => data[k] = v);

      // costos
      let costos = [];
      document.querySelectorAll("#tablaCostos tbody tr").forEach(fila => {
        costos.push({
          concepto: fila.querySelector("[name='concepto']").value,
          unidades: fila.querySelector("[name='unidades']").value,
          costoUnidad: fila.querySelector("[name='costoUnidad']").value,
          total: fila.querySelector(".totalFila").textContent
        });
      });
      data["costos"] = costos;
      data["totalGeneral"] = document.getElementById("granTotal").textContent;

      await db.collection("historial-odontologia").add(data);
      window.location.href = "preview-odontologia.html?email=" + data.email;
    });
  </script>
</body>
</html>
