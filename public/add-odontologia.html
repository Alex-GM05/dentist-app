<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historia Clínica - Odontología</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Historia Clínica</h1>
    <h2>Dra. Noemí Castillo</h2>
  </header>

  <main>
    <form id="formHistoria">
      <label>Fecha: <input type="date" name="fecha" required></label>
      <label>Nombre del paciente: <input type="text" name="nombre" required></label>
      <label>Edad: <input type="number" name="edad" required></label>
      <label>Dirección: <input type="text" name="direccion"></label>
      <label>Teléfono: <input type="tel" name="telefono"></label>
      <label>Mail: <input type="email" name="email"></label>
      <label>Ocupación: <input type="text" name="ocupacion"></label>
      <label>Estado Civil: <input type="text" name="estadoCivil"></label>
      <label>Recomendado por: <input type="text" name="recomendadoPor"></label>

      <label>¿Se encuentra en buen estado de salud?</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="salud" value="Sí"> Sí</label>
        <label><input type="checkbox" name="salud" value="No"> No</label>
      </div>

      <label>Peso: <input type="number" name="peso"> kg</label>
      <label>Estatura: <input type="number" name="estatura"> m</label>

      <label>¿Presenta alguna enfermedad sistémica?</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="sistemica" value="Sí"> Sí</label>
        <label><input type="checkbox" name="sistemica" value="No"> No</label>
      </div>

      <label>¿Cuál? <input type="text" name="sistemicaCual"></label>

      <label>¿Alguna enfermedad que crea conveniente mencionar? <input type="text" name="enfermedadExtra"></label>

      <label>¿Toma algún medicamento?</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="medicamento" value="Sí"> Sí</label>
        <label><input type="checkbox" name="medicamento" value="No"> No</label>
      </div>

      <label>¿Cuál? <input type="text" name="medicamentoCual"></label>

      <label>Alergias: <input type="text" name="alergias"></label>
      <label>¿Problemas con anestesia local? <input type="text" name="anestesia"></label>
      <label>¿Última vez que visitó al dentista? <input type="date" name="ultimaVisita"></label>

      <label>¿Fuma?</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="fuma" value="Sí"> Sí</label>
        <label><input type="checkbox" name="fuma" value="No"> No</label>
      </div>

      <label>Frecuencia y cantidad: <input type="text" name="fumaCantidad"></label>
      <label>¿Tiene o ha tenido contacto con drogas? <input type="text" name="drogas"></label>

      <h3>MUJERES</h3>
      <label>¿Está embarazada?</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="embarazo" value="Sí"> Sí</label>
        <label><input type="checkbox" name="embarazo" value="No"> No</label>
      </div>
      <label>¿Mes de gestación? <input type="text" name="mesGestacion"></label>

      <label>¿Toma anticonceptivo?</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="anticonceptivo" value="Sí"> Sí</label>
        <label><input type="checkbox" name="anticonceptivo" value="No"> No</label>
      </div>
      <label>¿Cuál? <input type="text" name="cualAnticonceptivo"></label>

      <h3>MENORES DE EDAD</h3>
      <label>Nombre del padre o madre: <input type="text" name="tutor"></label>
      <label>Teléfono de contacto: <input type="tel" name="telefonoTutor"></label>

      <label>Motivo de consulta:</label>
      <textarea name="motivoConsulta" rows="4"></textarea>

      <div class="form-buttons">
        <button type="button" onclick="guardarHistoria()">Agregar</button>
        <button type="button" onclick="location.href='select-add.html'" class="danger">Cancelar</button>
      </div>
    </form>
  </main>

  <script>
    function guardarHistoria() {
      const form = document.getElementById("formHistoria");
      const data = new FormData(form);
      const jsonData = {};
      data.forEach((value, key) => {
        if (jsonData[key]) {
          if (Array.isArray(jsonData[key])) {
            jsonData[key].push(value);
          } else {
            jsonData[key] = [jsonData[key], value];
          }
        } else {
          jsonData[key] = value;
        }
      });

      localStorage.setItem("historiaOdontologia", JSON.stringify(jsonData));
      location.href = "preview-odontologia.html";
    }
  </script>
</body>
</html>
