<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia Clínica Odontología</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
</head>
<body>
  <div class="container">
    <h2>Historia Clínica Odontología</h2>
    <form id="odontologiaForm">
      <!-- Datos Generales -->
      <h3>Datos Generales</h3>
      <div class="form-grid">
        <label>Nombre completo: <input type="text" name="nombre" required></label>
        <label>Correo electrónico: <input type="email" name="correo" required></label>
        <label>Edad: <input type="number" name="edad" id="edad" required></label>
        <label>Sexo: 
          <select name="sexo" id="sexo" required>
            <option value="">Seleccione</option>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
          </select>
        </label>
        <label>Fecha: <input type="date" name="fecha" required></label>
      </div>

      <!-- Sección condicional -->
      <div id="embarazoCampos" style="display:none;">
        <h4>Información para mujeres</h4>
        <label>¿Está embarazada?: 
          <select name="embarazo">
            <option value="">Seleccione</option>
            <option value="si">Sí</option>
            <option value="no">No</option>
          </select>
        </label>
      </div>

      <div id="tutorCampos" style="display:none;">
        <h4>Información para menores de edad</h4>
        <label>Nombre del tutor: <input type="text" name="tutor"></label>
        <label>Teléfono del tutor: <input type="text" name="telefonoTutor"></label>
      </div>

      <!-- Antecedentes -->
      <h3>Antecedentes Médicos</h3>
      <textarea name="antecedentes" rows="3"></textarea>

      <h3>Hábitos</h3>
      <textarea name="habitos" rows="3"></textarea>

      <!-- Exploración Clínica -->
      <h3>Exploración Clínica</h3>
      <textarea name="exploracion" rows="3"></textarea>
      <h4>Odontograma</h4>
      <img src="OD.png" alt="Odontograma" class="odontograma">

      <!-- Diagnóstico y Plan -->
      <h3>Diagnóstico</h3>
      <textarea name="diagnostico" rows="3"></textarea>

      <h3>Plan de Tratamiento</h3>
      <textarea name="tratamiento" rows="3"></textarea>

      <!-- Tabla de costos -->
      <h3>Costos</h3>
      <table id="tablaCostos">
        <thead>
          <tr>
            <th>Concepto</th>
            <th>Unidades</th>
            <th>Costo Unitario</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="costosBody">
          <tr>
            <td><input type="text" name="concepto[]"></td>
            <td><input type="number" name="unidades[]" class="unidad"></td>
            <td><input type="number" name="costoUnit[]" class="costoUnit"></td>
            <td><input type="number" name="total[]" class="total" readonly></td>
          </tr>
        </tbody>
      </table>
      <button type="button" onclick="agregarFila()">Agregar concepto</button>
      <h4>Total General: <span id="totalGeneral">0</span></h4>

      <!-- Receta -->
      <h3>Receta</h3>
      <textarea name="receta" rows="4"></textarea>

      <!-- Firmas -->
      <h3>Firmas</h3>
      <div class="form-grid">
        <label>Firma del Paciente: ____________________________</label>
        <label>Firma del Doctor: ____________________________</label>
      </div>

      <button type="submit">Guardar</button>
      <button type="button" onclick="window.location.href='preview-odontologia.html'">Vista Previa</button>
    </form>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Mostrar campos condicionales
    document.getElementById("sexo").addEventListener("change", function() {
      document.getElementById("embarazoCampos").style.display = this.value === "mujer" ? "block" : "none";
    });
    document.getElementById("edad").addEventListener("input", function() {
      document.getElementById("tutorCampos").style.display = this.value < 18 ? "block" : "none";
    });

    // Tabla de costos: cálculo automático
    function calcularTotales() {
      let totalGeneral = 0;
      document.querySelectorAll("#costosBody tr").forEach(row => {
        const unidad = row.querySelector(".unidad")?.value || 0;
        const costoUnit = row.querySelector(".costoUnit")?.value || 0;
        const total = row.querySelector(".total");
        const subtotal = unidad * costoUnit;
        total.value = subtotal;
        totalGeneral += subtotal;
      });
      document.getElementById("totalGeneral").innerText = totalGeneral;
    }
    document.addEventListener("input", e => {
      if (e.target.classList.contains("unidad") || e.target.classList.contains("costoUnit")) {
        calcularTotales();
      }
    });
    function agregarFila() {
      const row = `
        <tr>
          <td><input type="text" name="concepto[]"></td>
          <td><input type="number" name="unidades[]" class="unidad"></td>
          <td><input type="number" name="costoUnit[]" class="costoUnit"></td>
          <td><input type="number" name="total[]" class="total" readonly></td>
        </tr>`;
      document.getElementById("costosBody").insertAdjacentHTML("beforeend", row);
    }

    // Guardar en Firestore
    document.getElementById("odontologiaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      data.timestamp = new Date();

      await db.collection("historial-odontologia").add(data);
      alert("Historial guardado correctamente.");
    });
  </script>
</body>
</html>
