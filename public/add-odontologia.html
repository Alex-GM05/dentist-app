<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Historia Clínica Odontológica</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>
</head>
<body>
  <div class="form-container">
    <h1>Historia Clínica Odontológica</h1>
    <form id="odontologiaForm">
      
      <!-- Datos Generales -->
      <section>
        <h2>Datos Generales</h2>
        <div class="two-columns">
          <label>Fecha: <input type="date" name="fecha" required></label>
          <label>Correo del Paciente: <input type="email" name="correo" required></label>
          <label>Nombre: <input type="text" name="nombre" required></label>
          <label>Edad: <input type="number" name="edad" required></label>
          <label>Sexo:
            <select name="sexo" id="sexo">
              <option value="">Seleccione</option>
              <option value="Hombre">Hombre</option>
              <option value="Mujer">Mujer</option>
            </select>
          </label>
          <label>Ocupación: <input type="text" name="ocupacion"></label>
        </div>
      </section>

      <!-- Condicionales -->
      <section>
        <h2>Información Adicional</h2>
        <label>¿Consume Drogas?
          <select name="drogas" id="drogas">
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </label>
        <div id="drogasExtra" style="display:none;">
          <label>¿Cuáles? <input type="text" name="tipoDrogas"></label>
        </div>

        <label>¿Está Embarazada? (solo mujeres)
          <select name="embarazo" id="embarazo">
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </label>
        <div id="embarazoExtra" style="display:none;">
          <label>Meses de gestación: <input type="number" name="mesesEmbarazo"></label>
        </div>
      </section>

      <!-- Costos -->
      <section>
        <h2>Costos</h2>
        <table id="tablaCostos">
          <thead>
            <tr>
              <th>Concepto</th>
              <th>Unidad</th>
              <th>Costo por unidad</th>
              <th>Total</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button type="button" id="agregarFila">Agregar Concepto</button>
        <h3>Total General: $<span id="totalGeneral">0</span></h3>
      </section>

      <!-- Receta -->
      <section>
        <h2>Receta</h2>
        <textarea name="receta" rows="5" placeholder="Escriba aquí la receta..."></textarea>
      </section>

      <!-- Imagen de dientes -->
      <section>
        <h2>Odontograma</h2>
        <img src="odontogr.png" alt="Odontograma" class="odontograma">
      </section>

      <button type="submit">Guardar Historia Clínica</button>
    </form>
  </div>

  <script>
    // 🔹 Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔹 Mostrar condicionales
    document.getElementById("drogas").addEventListener("change", e => {
      document.getElementById("drogasExtra").style.display = e.target.value === "Sí" ? "block" : "none";
    });
    document.getElementById("sexo").addEventListener("change", e => {
      document.getElementById("embarazo").parentElement.style.display = e.target.value === "Mujer" ? "block" : "none";
    });
    document.getElementById("embarazo").addEventListener("change", e => {
      document.getElementById("embarazoExtra").style.display = e.target.value === "Sí" ? "block" : "none";
    });

    // 🔹 Costos dinámicos
    document.getElementById("agregarFila").addEventListener("click", () => {
      const tbody = document.querySelector("#tablaCostos tbody");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><input type="text" name="concepto"></td>
        <td><input type="number" name="unidad" value="1"></td>
        <td><input type="number" name="costoUnidad" value="0"></td>
        <td class="total">0</td>
        <td><button type="button" class="eliminar">X</button></td>`;
      tbody.appendChild(row);
      actualizarCostos();
    });

    document.addEventListener("input", e => {
      if (e.target.name === "unidad" || e.target.name === "costoUnidad") {
        actualizarCostos();
      }
    });

    document.addEventListener("click", e => {
      if (e.target.classList.contains("eliminar")) {
        e.target.closest("tr").remove();
        actualizarCostos();
      }
    });

    function actualizarCostos() {
      let totalGeneral = 0;
      document.querySelectorAll("#tablaCostos tbody tr").forEach(row => {
        const unidad = parseFloat(row.querySelector("[name='unidad']").value) || 0;
        const costoUnidad = parseFloat(row.querySelector("[name='costoUnidad']").value) || 0;
        const total = unidad * costoUnidad;
        row.querySelector(".total").textContent = total.toFixed(2);
        totalGeneral += total;
      });
      document.getElementById("totalGeneral").textContent = totalGeneral.toFixed(2);
    }

    // 🔹 Guardar en Firestore
    document.getElementById("odontologiaForm").addEventListener("submit", async e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      // Costos
      let costos = [];
      document.querySelectorAll("#tablaCostos tbody tr").forEach(row => {
        costos.push({
          concepto: row.querySelector("[name='concepto']").value,
          unidad: row.querySelector("[name='unidad']").value,
          costoUnidad: row.querySelector("[name='costoUnidad']").value,
          total: row.querySelector(".total").textContent
        });
      });
      data.costos = costos;
      data.totalGeneral = document.getElementById("totalGeneral").textContent;

      try {
        await db.collection("historial-odontologia").add(data);
        alert("Historia clínica guardada correctamente.");
        window.location.href = "preview-odontologia.html?correo=" + data.correo;
      } catch (error) {
        console.error(error);
        alert("Error al guardar: " + error.message);
      }
    });
  </script>
</body>
</html>
