<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historia Clínica - Odontología</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

</head>
<body>
  <header>
    <h1>Historia Clínica</h1>
    <p>Dra. Noemí Castillo</p>
  </header>

  <main>
    <form id="formOdontologia">
      <div style="display: flex; flex-wrap: wrap; gap: 1rem;">
        <div style="flex: 1 1 45%;">
          <label>Nombre del paciente:</label>
          <input type="text" name="nombre" required />

          <label>Dirección:</label>
          <input type="text" name="direccion" />

          <label>Teléfono:</label>
          <input type="tel" name="telefono" />

          <label>Ocupación:</label>
          <input type="text" name="ocupacion" />

          <label>Estado Civil:</label>
          <input type="text" name="estadoCivil" />

          <label>¿En buen estado de salud?</label>
          <select name="estadoSalud">
            <option value="Sí">Sí</option>
            <option value="No">No</option>
          </select>

          <label>¿Toma medicamentos? ¿Cuál?</label>
          <input type="text" name="medicamento" />
        </div>

        <div style="flex: 1 1 45%;">
          <label>Edad:</label>
          <input type="number" name="edad" />

          <label>Celular:</label>
          <input type="tel" name="celular" />

          <label>Mail:</label>
          <input type="email" name="email" />

          <label>Recomendado por:</label>
          <input type="text" name="recomendadoPor" />

          <label>Peso:</label>
          <input type="text" name="peso" />

          <label>Estatura:</label>
          <input type="text" name="estatura" />

          <label>¿Alergias? ¿A qué?</label>
          <input type="text" name="alergias" />
        </div>
      </div>

      <label>¿Enfermedad sistémica? ¿Cuál?</label>
      <input type="text" name="sistemica" />

      <label>¿Alguna enfermedad importante?</label>
      <input type="text" name="enfermedadImportante" />

      <label>¿Primera vez con anestesia?</label>
      <input type="text" name="primeraAnestesia" />

      <label>¿Problemas con anestesia local?</label>
      <input type="text" name="problemasAnestesia" />

      <label>¿Última vez que visitó al dentista?</label>
      <input type="date" id="fecha" name="fecha" required>

      <label>¿Fuma? ¿Frecuencia/Cantidad?</label>
      <input type="text" name="fuma" />

      <label>¿Contacto con drogas?</label>
      <input type="text" name="drogas" />

      <div class="checkbox-group">
        <label><input type="checkbox" id="esMujer" /> Mujer</label>
        <label><input type="checkbox" id="esMenor" /> Menor de edad</label>
      </div>

      <div id="mujerCampos" style="display: none;">
        <label>¿Embarazada?</label>
        <input type="text" name="embarazada" />

        <label>¿Mes de gestación?</label>
        <input type="text" name="mesGestacion" />

        <label>¿Anticonceptivos? ¿Cuál?</label>
        <input type="text" name="anticonceptivos" />
      </div>

      <div id="menorCampos" style="display: none;">
        <label>Nombre del padre o madre:</label>
        <input type="text" name="nombrePadre" />

        <label>Teléfono del trabajo:</label>
        <input type="text" name="telefonoTrabajo" />
      </div>

      <h3>Motivo de consulta</h3>
      <textarea name="motivoConsulta" rows="6" placeholder="Describa el motivo de la consulta..."></textarea>

      <div class="form-buttons">
        <button type="submit">Agregar</button>
        <button type="button" onclick="window.location.href='select-add.html'" class="danger">Cancelar</button>
        <button type="button" onclick="window.location.href='receta.html'">Receta</button>
      </div>
    </form>
  </main>

  <script>
    // Mostrar campos condicionales
    document.getElementById("esMujer").addEventListener("change", function() {
      document.getElementById("mujerCampos").style.display = this.checked ? "block" : "none";
    });

    document.getElementById("esMenor").addEventListener("change", function() {
      document.getElementById("menorCampos").style.display = this.checked ? "block" : "none";
    });

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().signInAnonymously().catch((error) => {
        console.error("Error al iniciar sesión anónima:", error);
    });

    document.getElementById("formOdontologia").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      try {
        const docRef = await db.collection("historial-odontologia").add(data);
        window.location.href = `preview-odontologia.html?id=${docRef.id}`;
      } catch (err) {
        alert("Error al guardar: " + err.message);
      }
    });
  </script>
</body>
</html>
