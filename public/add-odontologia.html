<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historia Clínica - Odontología</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form id="formularioOdontologia">
      <h2>Historia Clínica - Dra. Noemi Castillo</h2>

      <label>Nombre del paciente: <input name="nombre" required></label>
      <label>Edad: <input name="edad" type="number"></label>
      <label>Dirección: <input name="direccion"></label>
      <label>Teléfono: <input name="telefono"></label>
      <label>Celular: <input name="celular"></label>
      <label>Mail: <input name="mail" type="email"></label>
      <label>Ocupación: <input name="ocupacion"></label>
      <label>Estado Civil: <input name="estadoCivil"></label>
      <label>Recomendado por: <input name="recomendadoPor"></label>
      <label>¿Está en buen estado de salud? <select name="salud"><option>Sí</option><option>No</option></select></label>
      <label>Peso: <input name="peso" type="text"></label>
      <label>Estatura: <input name="estatura" type="text"></label>
      <label>¿Tiene enfermedad sistémica? <select name="enfermedadSistemica"><option>No</option><option>Sí</option></select> ¿Cuál? <input name="enfermedadCual"></label>
      <label>¿Toma medicamentos? ¿Cuáles? <input name="medicamentos"></label>
      <label>¿Es alérgico a algo? <input name="alergias"></label>
      <label>¿Primera vez con anestesia? <input name="primeraAnestesia"></label>
      <label>¿Problemas con anestesia local? <input name="problemasAnestesia"></label>
      <label>Última vez que visitó al dentista: <input name="ultimaVisita"></label>
      <label>¿Fuma? <input name="fuma"> Frecuencia y cantidad: <input name="fumaCantidad"></label>
      <label>¿Drogas? <input name="drogas"></label>

      <h3>Mujeres</h3>
      <label>¿Embarazada? <input name="embarazada"></label>
      <label>Mes de gestación: <input name="mesGestacion"></label>
      <label>¿Anticonceptivos? ¿Cuáles? <input name="anticonceptivos"></label>

      <h3>Menores de edad</h3>
      <label>Nombre padre o madre: <input name="padreOMadre"></label>
      <label>Teléfono de trabajo: <input name="telTrabajo"></label>

      <label>Motivo de consulta: <textarea name="motivoConsulta" rows="3"></textarea></label>

      <div class="form-buttons">
        <button type="submit">Agregar</button>
        <button type="button" onclick="window.location.href='select-add.html'">Cancelar</button>
        <button type="button" onclick="window.location.href='receta.html'">Receta</button>
      </div>
    </form>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="add-odontologia.js"></script>
</body>
</html>
