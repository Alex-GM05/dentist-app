<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historia Clínica Odontología</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Historia Clínica Odontológica</h1>
    <form id="odontologiaForm">

      <!-- DATOS GENERALES -->
      <section>
        <h2>Datos Generales</h2>
        <div class="grid-2">
          <label>Nombre completo <input type="text" name="nombre" required></label>
          <label>Edad <input type="number" name="edad" min="0" required></label>
          <label>Sexo 
            <select name="sexo" required>
              <option value="">Seleccione</option>
              <option>Hombre</option>
              <option>Mujer</option>
            </select>
          </label>
          <label>Correo electrónico <input type="email" name="email" required></label>
          <label>Teléfono <input type="text" name="telefono"></label>
          <label>Fecha <input type="date" name="fecha" required></label>
        </div>
      </section>

      <!-- ANTECEDENTES -->
      <section>
        <h2>Antecedentes</h2>
        <div class="grid-2">
          <label>¿En buen estado de salud?
            <select name="estadoSalud"><option>Sí</option><option>No</option></select>
          </label>
          <label>¿Toma medicamentos? <input type="text" name="medicamentos"></label>
          <label>¿Alergias? <input type="text" name="alergias"></label>
          <label>¿Operaciones previas? <input type="text" name="operaciones"></label>
          <label>¿Drogas? 
            <select name="drogas" id="drogas"><option>No</option><option>Sí</option></select>
          </label>
        </div>
        <div id="drogasExtra" style="display:none;">
          <label>Especificar drogas <input type="text" name="tipoDrogas"></label>
        </div>
        <div>
          <label>¿Está embarazada? 
            <select name="embarazo" id="embarazo"><option>No</option><option>Sí</option></select>
          </label>
        </div>
        <div id="embarazoExtra" style="display:none;">
          <label>Meses de embarazo <input type="number" name="mesesEmbarazo" min="0"></label>
        </div>
      </section>

      <!-- MOTIVO DE CONSULTA -->
      <section>
        <h2>Motivo de consulta</h2>
        <textarea name="motivoConsulta"></textarea>
      </section>

      <!-- ODONTOGRAMA (TABLA) -->
      <section>
        <h2>Odontograma</h2>
        <table id="tablaOdontograma">
          <thead>
            <tr><th>Diente</th><th>Dx</th><th>Tx</th></tr>
          </thead>
          <tbody>
            ${[...Array(8)].map((_,i)=>`
              <tr>
                <td>${i+11}</td>
                <td><input type="text" name="dx${i+11}"></td>
                <td><input type="text" name="tx${i+11}"></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </section>

      <!-- COSTOS -->
      <section>
        <h2>Costos</h2>
        <table id="tablaCostos">
          <thead>
            <tr><th>Fecha</th><th>Concepto</th><th>Costo</th><th>Total</th><th>Acción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <button type="button" onclick="agregarFila()">➕ Agregar concepto</button>
        <h3>Total: $<span id="granTotal">0.00</span></h3>
      </section>

      <!-- RECETA -->
      <section>
        <h2>Receta</h2>
        <textarea name="receta" rows="5"></textarea>
      </section>

      <!-- IMÁGENES -->
      <section>
        <h2>Imágenes</h2>
        <input type="file" id="imagenes" accept="image/*" multiple>
        <div id="previewImagenes" class="images-grid"></div>
      </section>

      <!-- BOTONES -->
      <div class="btn-row">
        <button type="submit">Guardar y ver impresión</button>
        <button type="button" onclick="window.location.href='select-add.html'" class="danger">Cancelar</button>
      </div>
    </form>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAmuMId-e9LiO0cxadGRtxYBK9Tqi2khdI",
      authDomain: "dentist-app-2bb07.firebaseapp.com",
      projectId: "dentist-app-2bb07",
      storageBucket: "dentist-app-2bb07.firebasestorage.app",
      messagingSenderId: "410183687912",
      appId: "1:410183687912:web:43ee87e4a9122edb74b35d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Condicionales
    document.getElementById("embarazo").addEventListener("change", e => {
      document.getElementById("embarazoExtra").style.display = e.target.value==="Sí"?"block":"none";
    });
    document.getElementById("drogas").addEventListener("change", e => {
      document.getElementById("drogasExtra").style.display = e.target.value==="Sí"?"block":"none";
    });

    // Costos dinámicos
    const tbodyCostos=document.querySelector("#tablaCostos tbody");
    function agregarFila(fecha="",concepto="",costo=0){
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td><input type="date" value="${fecha}"></td>
        <td><input type="text" value="${concepto}"></td>
        <td><input type="number" value="${costo}" step="0.01"></td>
        <td class="totalFila">0.00</td>
        <td><button type="button" onclick="this.closest('tr').remove();calcularTotal()">❌</button></td>`;
      tbodyCostos.appendChild(tr);
      tr.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",()=>recalcularFila(tr)));
      recalcularFila(tr);
    }
    function recalcularFila(tr){
      const costo=parseFloat(tr.querySelector("input[type='number']").value)||0;
      tr.querySelector(".totalFila").textContent=costo.toFixed(2);
      calcularTotal();
    }
    function calcularTotal(){
      let t=0;document.querySelectorAll(".totalFila").forEach(td=>t+=parseFloat(td.textContent)||0);
      document.getElementById("granTotal").textContent=t.toFixed(2);
    }
    agregarFila();

    // Imágenes preview
    const inputImgs=document.getElementById("imagenes"),preview=document.getElementById("previewImagenes");
    inputImgs.addEventListener("change",()=>{
      preview.innerHTML="";
      [...inputImgs.files].forEach(f=>{
        const url=URL.createObjectURL(f);
        preview.innerHTML+=`<div class="thumb"><img src="${url}"><p>${f.name}</p></div>`;
      });
    });

    // Guardar
    document.getElementById("odontologiaForm").addEventListener("submit",async e=>{
      e.preventDefault();
      const data={};
      new FormData(e.target).forEach((v,k)=>data[k]=v);
      data.costos=[...tbodyCostos.querySelectorAll("tr")].map(tr=>({
        fecha:tr.querySelector("input[type='date']").value,
        concepto:tr.querySelector("input[type='text']").value,
        costo:parseFloat(tr.querySelector("input[type='number']").value)||0
      }));
      data.total=parseFloat(document.getElementById("granTotal").textContent);
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();

      let docRef=await db.collection("historial-odontologia").add(data);

      // subir imágenes
      const urls=[];
      for(const f of inputImgs.files){
        const ref=storage.ref(`historial-odontologia/${docRef.id}/${f.name}`);
        await ref.put(f);
        urls.push(await ref.getDownloadURL());
      }
      await docRef.update({imagenes:urls});

      window.location.href=`preview-odontologia.html?id=${docRef.id}`;
    });
  </script>
</body>
</html>
